<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dammie  Backend Systems Engineer</title>
  <desc id="desc">Editorial terminal banner introducing Dammie, a backend systems engineer focused on multi-tenant SaaS, APIs, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      <![CDATA[
        .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .cursor {
          animation: blink 1.1s steps(1, end) infinite;
        }
        @keyframes blink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }
        .scan {
          animation: drift 8s ease-in-out infinite alternate;
        }
        @keyframes drift {
          from { transform: translateY(0); opacity: 0.04; }
          to { transform: translateY(12px); opacity: 0.08; }
        }
      ]]>
    </style>
  </defs>

  <!-- Atmosphere -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect class="scan" x="0" y="40" width="1200" height="2" fill="#3fb950" opacity="0.06"/>
  <rect class="scan" x="0" y="180" width="1200" height="1" fill="#3fb950" opacity="0.05"/>
  <rect class="scan" x="0" y="280" width="1200" height="1" fill="#3fb950" opacity="0.04"/>

  <!-- Terminal window -->
  <g filter="url(#softShadow)">
    <rect x="60" y="36" width="1080" height="288" rx="14" fill="url(#panelGrad)" stroke="#30363d" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="60" y="36" width="1080" height="44" rx="14" fill="#21262d"/>
    <rect x="60" y="58" width="1080" height="22" fill="#21262d"/>
    <circle cx="92" cy="58" r="7" fill="#ff5f56"/>
    <circle cx="116" cy="58" r="7" fill="#ffbd2e"/>
    <circle cx="140" cy="58" r="7" fill="#27c93f"/>
    <text x="600" y="63" text-anchor="middle" class="prompt" font-size="14" fill="#8b949e">dammie@github  zsh</text>

    <!-- Accent rail -->
    <rect x="60" y="80" width="4" height="244" fill="#3fb950" opacity="0.85"/>

    <!-- Terminal content -->
    <g class="prompt" font-size="22" fill="#e6edf3">
      <text x="100" y="128">
        <tspan fill="#3fb950">$</tspan>
        <tspan dx="12" fill="#8b949e">whoami</tspan>
      </text>
      <text x="100" y="168" font-size="28" font-weight="700" fill="#e6edf3">Dammie</text>

      <text x="100" y="214">
        <tspan fill="#3fb950">$</tspan>
        <tspan dx="12" fill="#8b949e">role --brief</tspan>
      </text>
      <text x="100" y="252" font-size="20" fill="#e6edf3">Backend Systems Engineer</text>
      <text x="100" y="282" font-size="16" fill="#8b949e">multi-tenant SaaS  �  APIs  �  PostgreSQL</text>

      <text x="100" y="318">
        <tspan fill="#3fb950">$</tspan>
        <tspan dx="12" fill="#8b949e">status</tspan>
        <tspan dx="16" fill="#3fb950">available for software engineering roles</tspan>
        <tspan class="cursor" dx="6" fill="#3fb950">�</tspan>
      </text>
    </g>
  </g>
</svg>
